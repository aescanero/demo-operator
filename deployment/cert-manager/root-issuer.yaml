# root-issuer.yaml
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer-root
spec:
  selfSigned: {}
---
# Create a root certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: root-secret
  namespace: cert-manager
spec:
  isCA: true
  commonName: "Root CA"
  secretName: root-secret
  duration: "87600h" # 10 años
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-issuer-root
    kind: ClusterIssuer
    group: cert-manager.io
---
