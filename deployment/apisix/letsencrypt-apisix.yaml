apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-apisix
spec:
  acme:
    email: aescanero@disasterproject.com
    privateKeySecretRef:
      name: letsencrypt-apisix
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
    - http01:
        ingress:
          ingressClassName: nginx
