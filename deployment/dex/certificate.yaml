apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dex-tls
  namespace: dex
spec:
  isCA: false
  commonName: dex.dex.svc
  secretName: dex-tls
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: apisix-issuer-intermediate
    kind: ClusterIssuer
    group: cert-manager.io